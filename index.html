<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCC Collection CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  </defs>
</svg>

<div class="app">
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg></span>
      <div><b>DCC Collections</b><small>Collection CRM</small></div>
      <button type="button" class="side-close" id="side-close" aria-label="Close menu"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <nav class="nav">
      <div class="nav-label">Workspace</div>
      <button type="button" class="nav-item" data-nav="dashboard"><svg class="ic" aria-hidden="true"><use href="#i-dashboard"/></svg>Dashboard</button>
      <button type="button" class="nav-item" data-nav="customers"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg>Customers</button>
      <button type="button" class="nav-item" data-nav="invoices"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg>Invoices</button>
      <button type="button" class="nav-item" data-nav="copies"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg>Receiving copies</button>
      <button type="button" class="nav-item" data-nav="followups"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg>Follow-ups</button>
      <button type="button" class="nav-item" data-nav="reports"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg>Reports</button>
    </nav>
    <div class="tree-slot"><canvas id="tree" aria-hidden="true"></canvas></div>
    <div class="side-foot">
      <span class="avatar">DC</span>
      <div><b>DCC Supply Chain</b><span>Okhla and Gurgaon</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="lights" id="lights" aria-hidden="true"></div>
    <div class="wrap">
      <header class="top">
        <div class="top-l">
          <button type="button" class="menu-btn" id="menu" aria-label="Open menu"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
          <div>
            <h1 id="greet">Good morning</h1>
            <p class="sub" id="today"></p>
          </div>
        </div>
        <div class="top-r">
          <span class="pill sample" data-tip="All figures on this page are made-up examples. The real data will come from Tally and the FMS sheets.">Sample data</span>
          <span class="pill xmas"><svg class="ic sm" aria-hidden="true"><use href="#i-star"/></svg><span id="xmas"></span></span>
          <button type="button" class="icon-btn" id="theme" aria-label="Switch light or dark theme"><svg class="ic i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ic i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
        </div>
      </header>
      <div class="filters" id="filters"></div>
      <main id="view"></main>
    </div>
  </div>
</div>

<div class="dscrim" id="dscrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="snow-props" aria-hidden="true"><i></i><i></i></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="v-dashboard.js"></script>
<script src="v-customers.js"></script>
<script src="v-invoices.js"></script>
<script src="v-copies.js"></script>
<script src="v-followups.js"></script>
<script src="v-reports.js"></script>
<script>DCC.start();</script>
<script src="snowfall.js"></script>
</body>
</html>
